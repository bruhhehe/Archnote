# Archnote Hyprland window rules
# Source this file in your Hyprland config or place in ~/.config/hypr/conf.d/

# Make Archnote float
windowrulev2 = float, class:^(archnote)$
windowrulev2 = float, class:^(Archnote)$

# Optional: Set default size and position
windowrulev2 = size 320 380, class:^(archnote)$
windowrulev2 = size 320 380, class:^(Archnote)$

# Optional: Pin to all workspaces (uncomment if desired)
# windowrulev2 = pin, class:^(archnote)$
