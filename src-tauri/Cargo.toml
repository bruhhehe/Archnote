[package]
name = "archnote"
version = "0.2.0"
description = "A beautiful scratchpad note-taking app for Arch Linux"
authors = ["Danny McClelland <danny@dmcc.io>"]
edition = "2021"

[lib]
name = "archnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
